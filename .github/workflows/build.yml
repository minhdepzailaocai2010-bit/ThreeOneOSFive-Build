name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Tự động giải nén mã nguồn từ iOS26_2.zip
      - name: Extract source code
        run: |
          unzip -o iOS26_2.zip

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build App
        run: |
          PROJ_PATH=$(find . -name "ThreeOneOSFive.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          
          cd "$PROJ_DIR"
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find . -name "ThreeOneOSFive.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
